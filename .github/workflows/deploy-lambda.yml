name: Deploy lambda
on:
  push:
    branches: [Desarrollo, main]
    paths: ['lambda/calcular-co2/**', '.github/workflows/deploy-lambda.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        working-directory: lambda/calcular-co2
        run: zip -r ../function.zip index.mjs

      - name: Update function code
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws lambda update-function-code --function-name calcular-co2 --zip-file fileb://lambda/function.zip
